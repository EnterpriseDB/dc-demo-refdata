<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>{% block title %}Refdata Demo{% endblock %}</title>
  <style>
    :root {
      --edb-dark: #1A1F36;
      --edb-blue: #2c3e7b;
      --edb-accent: #4361ee;
      --edb-green: #16a34a;
      --edb-gray: #6b7280;
      --edb-light-bg: #f5f6fa;
      --edb-border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--edb-light-bg);
      color: #2d3142;
      margin: 0;
      line-height: 1.5;
    }

    nav {
      background: var(--edb-dark);
      color: #fff;
      padding: 0 2rem;
      height: 52px;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    nav span {
      color: var(--edb-accent);
    }

    .nav-github {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-weight: 400;
      font-size: .85rem;
      color: rgba(255, 255, 255, .75);
      transition: color .15s;
    }

    .nav-github:hover {
      color: #fff;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: .25rem;
    }

    h2 {
      font-size: 1.1rem;
      margin: 0 0 .5rem;
    }

    .subtitle {
      color: var(--edb-gray);
      margin-bottom: 1.5rem;
    }

    .card {
      background: #fff;
      border: 1px solid var(--edb-border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card p {
      color: var(--edb-gray);
      font-size: .9rem;
      margin: 0 0 1rem;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: .25rem;
    }

    .field label {
      font-size: .75rem;
      color: var(--edb-gray);
    }

    .field input {
      width: 100px;
      padding: .4rem .5rem;
      border: 1px solid var(--edb-border);
      border-radius: 5px;
      font-size: .9rem;
    }

    button {
      background: var(--edb-accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: .55rem 1.25rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #3451d1;
    }

    button:disabled {
      background: #a5b0e8;
      cursor: not-allowed;
    }

    a.button-link {
      display: inline-block;
      text-decoration: none;
      background: var(--edb-accent);
      color: #fff;
      border-radius: 6px;
      padding: .55rem 1.25rem;
      font-size: .9rem;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      font-size: .7rem;
      font-weight: 700;
      padding: .15em .55em;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-running {
      background: #fef9c3;
      color: #a16207;
    }

    .badge-done {
      background: #dcfce7;
      color: #15803d;
    }

    .badge-failed {
      background: #fee2e2;
      color: #b91c1c;
    }

    pre.console {
      background: #1e1e2e;
      color: #a6e3a1;
      padding: 1rem;
      border-radius: 8px;
      font-size: .82rem;
      line-height: 1.5;
      overflow-x: auto;
      max-height: 60vh;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    table.recent {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
    }

    table.recent th,
    table.recent td {
      text-align: left;
      padding: .4rem .5rem;
      border-bottom: 1px solid var(--edb-border);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    .progress-track {
      margin-top: .9rem;
      height: 10px;
      border-radius: 5px;
      background: var(--edb-light-bg);
      border: 1px solid var(--edb-border);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--edb-accent);
      border-radius: 5px 0 0 5px;
      transition: width .3s ease;
    }

    .stage-text {
      font-size: 1rem;
      font-weight: 600;
      color: var(--edb-dark);
    }

    .elapsed {
      margin-left: auto;
      font-size: .8rem;
      color: var(--edb-gray);
      font-variant-numeric: tabular-nums;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid var(--edb-border);
      border-top-color: var(--edb-accent);
      animation: spin .8s linear infinite;
      flex-shrink: 0;
    }

    .spinner.done {
      animation: none;
      border: none;
      width: 20px;
      height: 20px;
      background: var(--edb-green);
      -webkit-mask: radial-gradient(circle 9px at center, transparent 6px, black 7px);
      mask: radial-gradient(circle 9px at center, transparent 6px, black 7px);
    }

    .spinner.failed {
      animation: none;
      border: none;
      width: 20px;
      height: 20px;
      background: #dc2626;
      -webkit-mask: radial-gradient(circle 9px at center, transparent 6px, black 7px);
      mask: radial-gradient(circle 9px at center, transparent 6px, black 7px);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 700px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart-caption {
      font-size: .8rem;
      color: var(--edb-gray);
      text-align: center;
      margin-top: .5rem;
    }

    .timeline-chart {
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--edb-border);
    }

    .advisor-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }

    .advisor-stat {
      font-size: .8rem;
      color: var(--edb-gray);
    }

    .advisor-stat strong {
      display: block;
      font-size: 1.15rem;
      color: var(--edb-dark);
      font-variant-numeric: tabular-nums;
    }

    .rec-pill,
    .mx-pill {
      display: inline-block;
      padding: .2em .65em;
      border-radius: 12px;
      font-size: .78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .rec-strongly_recommended {
      background: #dcfce7;
      color: #15803d;
    }

    .rec-recommended {
      background: #fef9c3;
      color: #a16207;
    }

    .rec-neutral {
      background: #f3f4f6;
      color: #6b7280;
    }

    .rec-switch_to_heap {
      background: #fee2e2;
      color: #b91c1c;
    }

    .rec-already_refdata {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .mx-none {
      background: #f3f4f6;
      color: #6b7280;
    }

    .mx-low {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .mx-moderate {
      background: #fef9c3;
      color: #a16207;
    }

    .mx-high {
      background: #fed7aa;
      color: #c2410c;
    }

    .mx-critical {
      background: #fee2e2;
      color: #b91c1c;
    }

    .alter-stmt {
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: .8rem;
      background: #1e1e2e;
      color: #a6e3a1;
      padding: .6em .9em;
      border-radius: 6px;
      display: block;
      overflow-x: auto;
      white-space: pre;
      margin-top: .5rem;
    }

    .tooltip-label {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
    }

    .info-icon {
      position: relative;
      display: inline-flex;
      color: var(--edb-gray);
      cursor: help;
      font-size: .95em;
      line-height: 1;
    }

    .info-icon .tooltip-text {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      background: var(--edb-dark);
      color: #fff;
      text-align: left;
      padding: .65rem .75rem;
      border-radius: 6px;
      font-size: .75rem;
      font-weight: 400;
      line-height: 1.5;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
      transition: opacity .15s ease;
      z-index: 20;
    }

    .info-icon .tooltip-text code {
      background: rgba(255, 255, 255, .15);
      padding: .05em .3em;
      border-radius: 3px;
      font-size: .95em;
    }

    .info-icon .tooltip-text::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--edb-dark);
    }

    .info-icon:hover .tooltip-text,
    .info-icon:focus .tooltip-text,
    .info-icon:focus-visible .tooltip-text {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
